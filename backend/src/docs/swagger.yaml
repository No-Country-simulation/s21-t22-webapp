openapi: 3.0.0
info:
  title: Bus Reservation API
  description: API for bus reservations, payments, trips, and more.
  version: 1.0.0
paths:
  /api/users:
    get:
      summary: Get all users
      responses:
        200:
          description: List of all users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        201:
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/bus/add:
    post:
      summary: Add a new bus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bus'
      responses:
        201:
          description: Bus added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bus'

  /api/payment/pay:
    post:
      summary: Process a payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment'
      responses:
        201:
          description: Payment processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

  /api/reservar:
    post:
      summary: Make a seat reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reservation'
      responses:
        201:
          description: Reservation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'

  /api/route/add:
    post:
      summary: Add a new route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Route'
      responses:
        201:
          description: Route added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'

  /api/stop/create:
    post:
      summary: Create a new stop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Stop'
      responses:
        201:
          description: Stop created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stop'

  /api/trip/search:
    get:
      summary: Search for trips based on 'from' and 'to' locations
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
        - in: query
          name: to
          required: true
          schema:
            type: string
      responses:
        200:
          description: List of trips matching the search
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'

  /api/trip/get/{routeId}:
    get:
      summary: Get trips for a specific route
      parameters:
        - in: path
          name: routeId
          required: true
          schema:
            type: string
      responses:
        200:
          description: List of trips for the route
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'

  /api/trip/create:
    post:
      summary: Create a new trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Trip'
      responses:
        201:
          description: Trip created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'

components:
  schemas:
    User:
      type: object
      properties:
        name:
          type: string
        lastname:
          type: string
        phone:
          type: string
        dni:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        miles_balance:
          type: number
          format: float
    Bus:
      type: object
      properties:
        plate:
          type: string
        capacity:
          type: number
    Payment:
      type: object
      properties:
        reservationId:
          type: string
        paymentMethod:
          type: string
          enum: [credit_card, debit_card, paypal, cash]
        amount:
          type: number
    Reservation:
      type: object
      properties:
        tripId:
          type: string
        userId:
          type: string
        seatNumber:
          type: number
        from:
          type: string
        to:
          type: string
        price:
          type: number
    Route:
      type: object
      properties:
        name:
          type: string
        connections:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
              to:
                type: string
              distance:
                type: number
    Stop:
      type: object
      properties:
        name:
          type: string
        location:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
    Trip:
      type: object
      properties:
        bus:
          type: string
        route:
          type: string
        departureDate:
          type: string
          format: date-time
        arrivalDate:
          type: string
          format: date-time
        seats:
          type: array
          items:
            type: object
            properties:
              seatNumber:
                type: number
              availability:
                type: array
                items:
                  type: object
                  properties:
                    stop:
                      type: string
                    isAvailable:
                      type: boolean
