components:
  schemas:
    User:
      type: object
      properties:
        name:
          type: string
        lastname:
          type: string
        phone:
          type: string
        dni:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        miles_balance:
          type: number
          format: float
    Bus:
      type: object
      properties:
        plate:
          type: string
        capacity:
          type: number
    Payment:
      type: object
      properties:
        reservationId:
          type: string
        paymentMethod:
          type: string
          enum: [credit_card, debit_card, paypal, cash]
        amount:
          type: number
    Reservation:
      type: object
      properties:
        tripId:
          type: string
        userId:
          type: string
        seatNumber:
          type: number
        from:
          type: string
        to:
          type: string
        price:
          type: number
    Route:
      type: object
      properties:
        name:
          type: string
        connections:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
              to:
                type: string
              distance:
                type: number
    Stop:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "60d21b4667d0d8992e610c85"
        name:
          type: string
          example: "Buenos Aires"
        city:
          type: string
          example: "Buenos Aires"
        location:
          type: object
          properties:
            lat:
              type: number
              format: float
              example: -34.603722
            lng:
              type: number
              format: float
              example: -58.381592
        createdAt:
          type: string
          format: date-time
          example: "2023-01-01T12:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-01-02T15:30:00Z"
    Trip:
      type: object
      properties:
        bus:
          type: string
        route:
          type: string
        departureDate:
          type: string
          format: date-time
        arrivalDate:
          type: string
          format: date-time
        seats:
          type: array
          items:
            type: object
            properties:
              seatNumber:
                type: number
              availability:
                type: array
                items:
                  type: object
                  properties:
                    stop:
                      type: string
                    isAvailable:
                      type: boolean
