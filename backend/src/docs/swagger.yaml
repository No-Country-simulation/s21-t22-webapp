openapi: 3.0.0
info:
  title: Bus Reservation API
  description: API for bus reservations, payments, trips, and more.
  version: 1.0.0

servers:
  - url: http://localhost:5000
    description: Local server 

paths:
  /api/stop/search:
    get:
      summary: Search stops by name or city
      description: Returns a list of stops that match the search parameter.
      parameters:
        - name: q
          in: query
          description: Search term to filter stops by name or city.
          required: true
          schema:
            type: string
      responses:
        200:
          description: List of matching stops found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Stop'
        400:
          description: Missing or no matching search parameter.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: No se encontraron paradas con el criterio de búsqueda.

